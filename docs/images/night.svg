<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" width="720" height="206" role="img" aria-label="One night runs from 12:00 noon to 12:00 noon the next day. The machine gives the night's figures after the second 12:00, and then they are on the phone.">
<title>One night runs from 12:00 noon to 12:00 noon the next day. The machine gives the night's figures after the second 12:00, and then they are on the phone.</title>
<style>
  .paper { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .ink { fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #1f2328; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke: #6e7781; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .faint { fill: none; stroke: #afb8c1; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 7; }
  .solid { fill: #1f2328; stroke: none; }
  .hole { fill: #ffffff; stroke: none; }
  .bad { fill: #cf222e; stroke: none; }
  .badline { fill: none; stroke: #cf222e; stroke-width: 2.4; stroke-linecap: round; }
  .onbad { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 16px; }
  .b { font-size: 16px; font-weight: 600; }
  .s { font-size: 13px; fill: #57606a; }
  .m { font-size: 11px; }
  .ms { font-size: 10px; fill: #57606a; }
  .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .on { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .paper { fill: #0d1117; stroke: #30363d; }
    .ink, .thin { stroke: #e6edf3; }
    .line { stroke: #8b949e; }
    .faint { stroke: #484f58; }
    .solid { fill: #e6edf3; }
    .hole { fill: #0d1117; }
    .bad { fill: #f85149; }
    .badline { stroke: #f85149; }
    .onbad { stroke: #0d1117; }
    text { fill: #e6edf3; }
    .s, .ms { fill: #8b949e; }
    .num, .on { fill: #0d1117; }
  }
</style>
<rect class="paper" x="0.5" y="0.5" width="719" height="205" rx="12"/>
<path class="ink" d="M70 96H500"/>
<path class="ink" d="M70 87V105"/>
<text class="b" x="70" y="128" text-anchor="middle">12:00</text>
<text class="s" x="70" y="146" text-anchor="middle">midday</text>
<path class="ink" d="M285 87V105"/>
<text class="b" x="285" y="128" text-anchor="middle">00:00</text>
<text class="s" x="285" y="146" text-anchor="middle">midnight</text>
<path class="ink" d="M500 87V105"/>
<text class="b" x="500" y="128" text-anchor="middle">12:00</text>
<text class="s" x="500" y="146" text-anchor="middle">midday</text>
<rect class="solid" x="259.2" y="89" width="146.2" height="14" rx="7"/>
<text class="s" x="332.3" y="76" text-anchor="middle">therapy</text>
<path class="thin" d="M70 52V42H500V52"/>
<text class="t" x="285" y="34" text-anchor="middle">one night</text>
<path class="ink dash" d="M516 96H577"/>
<path class="ink" d="M573 89L580 96L573 103"/>
<rect class="ink" x="597" y="57.3" width="42" height="77.4" rx="7.9"/>
<path class="ink" d="M611 125.9H625"/>
<circle class="hole" cx="640" cy="62" r="13"/>
<circle class="ink" cx="640" cy="62" r="10"/>
<path class="ink" d="M635.5 62L639.1 65.6L644.5 58.9"/>
<text class="b" x="618" y="164" text-anchor="middle">after 12:00</text>
<text class="s" x="618" y="182" text-anchor="middle">the figures arrive</text>
</svg>
