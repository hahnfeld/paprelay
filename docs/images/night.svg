<path class="ink" d="M40 87V105"/>
<text class="b" x="40" y="128" text-anchor="middle">12:00</text>
<text class="s" x="40" y="146" text-anchor="middle">midday</text>
<path class="ink" d="M181 96V105"/>
<text class="b" x="181" y="128" text-anchor="middle">00:00</text>
<text class="s" x="181" y="146" text-anchor="middle">midnight</text>
<path class="ink" d="M322 87V105"/>
<text class="b" x="322" y="128" text-anchor="middle">12:00</text>
<text class="s" x="322" y="146" text-anchor="middle">midday</text>
<rect class="solid" x="158.4" y="89" width="101.5" height="14" rx="7"/>
<text class="s" x="209.2" y="78" text-anchor="middle">therapy</text>
<path class="thin" d="M40 52V42H322V52"/>
<text class="t" x="181" y="34" text-anchor="middle">one night</text>
