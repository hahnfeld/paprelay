<text class="m" x="58" y="160" text-anchor="start">AirSense 11 · serial ending 1234</text>
<text class="ms" x="58" y="192" text-anchor="start">Night of Sat, 14 Nov 2026</text>
<text class="b" x="58" y="216" text-anchor="start">7 h 12 min · AHI 1.4</text>
<text class="ms" x="58" y="235" text-anchor="start">Leak 95%: 9.6 L/min</text>
<text class="ms" x="58" y="249" text-anchor="start">Pressure 95%: 10.2 cmH₂O</text>
<text class="m" x="58" y="282" text-anchor="start">Up to date.</text>
<text class="ms" x="58" y="298" text-anchor="start">Last synchronised 5 minutes ago.</text>
<rect class="solid" x="58" y="318" width="132" height="32" rx="16"/>
<text class="m on" x="124" y="338" text-anchor="middle">Synchronise now</text>
<text class="m" x="58" y="388" text-anchor="start">Nights</text>
<text class="m" x="114" y="388" text-anchor="start">Sharing</text>
<text class="m" x="176" y="388" text-anchor="start">Device check</text>
<path class="faint" d="M272 106H290"/>
<circle class="solid" cx="308" cy="106" r="13"/>
<text class="num" x="308" y="111" text-anchor="middle">1</text>
<text class="t" x="332" y="102" text-anchor="start"><tspan font-weight="600">The picture.</tspan> Machine, phone, Health Connect.</text>
<text class="t" x="332" y="122" text-anchor="start">The lines show what is happening.</text>
<path class="faint" d="M272 212H290"/>
<circle class="solid" cx="308" cy="212" r="13"/>
<text class="num" x="308" y="217" text-anchor="middle">2</text>
<text class="t" x="332" y="208" text-anchor="start"><tspan font-weight="600">Last night.</tspan> Hours of use and AHI,</text>
<text class="t" x="332" y="228" text-anchor="start">then leak and pressure.</text>
<path class="faint" d="M272 286H290"/>
<circle class="solid" cx="308" cy="286" r="13"/>
<text class="num" x="308" y="291" text-anchor="middle">3</text>
<text class="t" x="332" y="291" text-anchor="start"><tspan font-weight="600">Status.</tspan> What happened the last time.</text>
<path class="faint" d="M272 334H290"/>
<circle class="solid" cx="308" cy="334" r="13"/>
<text class="num" x="308" y="339" text-anchor="middle">4</text>
<text class="t" x="332" y="339" text-anchor="start"><tspan font-weight="600">Synchronise now.</tspan> Tap to copy the data now.</text>
<path class="faint" d="M272 384H290"/>
<circle class="solid" cx="308" cy="384" r="13"/>
<text class="num" x="308" y="389" text-anchor="middle">5</text>
<text class="t" x="332" y="380" text-anchor="start"><tspan font-weight="600">Nights</tspan>: every night. <tspan font-weight="600">Sharing</tspan>: where the</text>
<text class="t" x="332" y="400" text-anchor="start">data goes. <tspan font-weight="600">Device check</tspan>: test the connections.</text>
</svg>
