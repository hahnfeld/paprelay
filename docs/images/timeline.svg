<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 256" width="480" height="256" role="img" aria-label="The picture of one night on the Nights page: a grey line from midday to midday, the sessions as thick lines on it, a tall mark for each apnoea and a short mark for each hypopnoea, with the hours below. On a night shown so far, a session that had not ended when the machine was last read ends in an open ring.">
<title>The picture of one night on the Nights page: a grey line from midday to midday, the sessions as thick lines on it, a tall mark for each apnoea and a short mark for each hypopnoea, with the hours below. On a night shown so far, a session that had not ended when the machine was last read ends in an open ring.</title>
<style>
  .paper { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .ink { fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #1f2328; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke: #6e7781; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .faint { fill: none; stroke: #afb8c1; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 7; }
  .solid { fill: #1f2328; stroke: none; }
  .hole { fill: #ffffff; stroke: none; }
  .bad { fill: #cf222e; stroke: none; }
  .badline { fill: none; stroke: #cf222e; stroke-width: 2.4; stroke-linecap: round; }
  .onbad { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 16px; }
  .b { font-size: 16px; font-weight: 600; }
  .s { font-size: 14px; fill: #57606a; }
  .c { font-size: 13px; }
  .x { font-size: 12px; fill: #57606a; }
  .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .on { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .paper { fill: #0d1117; stroke: #30363d; }
    .ink, .thin { stroke: #e6edf3; }
    .line { stroke: #8b949e; }
    .faint { stroke: #484f58; }
    .solid { fill: #e6edf3; }
    .hole { fill: #0d1117; }
    .bad { fill: #f85149; }
    .badline { stroke: #f85149; }
    .onbad { stroke: #0d1117; }
    text { fill: #e6edf3; }
    .s, .x { fill: #8b949e; }
    .num, .on { fill: #0d1117; }
  }
</style>
<rect class="paper" x="0.5" y="0.5" width="479" height="255" rx="12"/>
<path class="line" d="M40 82H440"/>
<path class="line" d="M40 82V91"/>
<text class="x" x="40" y="112" text-anchor="middle">12</text>
<path class="line" d="M140 82V91"/>
<text class="x" x="140" y="112" text-anchor="middle">18</text>
<path class="line" d="M240 82V91"/>
<text class="x" x="240" y="112" text-anchor="middle">00</text>
<path class="line" d="M340 82V91"/>
<text class="x" x="340" y="112" text-anchor="middle">06</text>
<path class="line" d="M440 82V91"/>
<text class="x" x="440" y="112" text-anchor="middle">12</text>
<path class="ink" d="M217.8 82H319.2" style="stroke-width: 9"/>
<path class="ink" d="M323.3 82H342.8" style="stroke-width: 9"/>
<path class="thin" d="M233.3 36V70"/>
<path class="thin" d="M246.7 56V70"/>
<path class="thin" d="M258.3 56V70"/>
<path class="thin" d="M276.7 36V70"/>
<path class="thin" d="M290 56V70"/>
<path class="thin" d="M300 36V70"/>
<path class="thin" d="M330 56V70"/>
<text class="s" x="40" y="140" text-anchor="start">Thick line: therapy. Tall mark: apnoea. Short mark: hypopnoea.</text>
<text class="x" x="40" y="160" text-anchor="start">Placed by the machine's clock, from midday to midday.</text>
<path class="line" d="M40 204H190"/>
<path class="ink" d="M70 204H150" style="stroke-width: 9"/>
<circle class="hole" cx="150" cy="204" r="8"/>
<circle class="ink" cx="150" cy="204" r="5.5"/>
<text class="x" x="210" y="194" text-anchor="start">So far: an open ring is a session</text>
<text class="x" x="210" y="211" text-anchor="start">that had not ended when the</text>
<text class="x" x="210" y="228" text-anchor="start">machine was last read.</text>
</svg>
