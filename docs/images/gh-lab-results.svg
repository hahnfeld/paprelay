<text class="x" x="56" y="476" text-anchor="start">Jan 5 at 12:00 PM</text>
<text class="c" x="56" y="498" text-anchor="start">CPAP mask leak in the night,</text>
<text class="c" x="56" y="516" text-anchor="start">95th percentile</text>
<text class="x" x="56" y="538" text-anchor="start">30 results</text>
<text class="b" x="372" y="502" text-anchor="end" style="font-size: 20px">20<tspan class="x" dx="5">L/min</tspan></text>
<path class="faint" d="M40 580V572A14 14 0 0 1 54 558H374A14 14 0 0 1 388 572V580"/>
