<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 592" width="480" height="592" role="img" aria-label="The Lab results screen in Google Health, with the chip PAPRelay (CPAP machine) chosen. Each card is one figure: the date at 12:00 PM, the title, the latest value with its unit, and the number of results, for example CPAP therapy usage in the night (hours), 7.5 h, 30 results. Number 3 marks the chip and the first card. The dates, values and counts are examples.">
<title>The Lab results screen in Google Health, with the chip PAPRelay (CPAP machine) chosen. Each card is one figure: the date at 12:00 PM, the title, the latest value with its unit, and the number of results, for example CPAP therapy usage in the night (hours), 7.5 h, 30 results. Number 3 marks the chip and the first card. The dates, values and counts are examples.</title>
<style>
  .paper { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .ink { fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #1f2328; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke: #6e7781; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .faint { fill: none; stroke: #afb8c1; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 7; }
  .solid { fill: #1f2328; stroke: none; }
  .hole { fill: #ffffff; stroke: none; }
  .bad { fill: #cf222e; stroke: none; }
  .badline { fill: none; stroke: #cf222e; stroke-width: 2.4; stroke-linecap: round; }
  .onbad { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 16px; }
  .b { font-size: 16px; font-weight: 600; }
  .s { font-size: 14px; fill: #57606a; }
  .c { font-size: 13px; }
  .x { font-size: 12px; fill: #57606a; }
  .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .on { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .paper { fill: #0d1117; stroke: #30363d; }
    .ink, .thin { stroke: #e6edf3; }
    .line { stroke: #8b949e; }
    .faint { stroke: #484f58; }
    .solid { fill: #e6edf3; }
    .hole { fill: #0d1117; }
    .bad { fill: #f85149; }
    .badline { stroke: #f85149; }
    .onbad { stroke: #0d1117; }
    text { fill: #e6edf3; }
    .s, .x { fill: #8b949e; }
    .num, .on { fill: #0d1117; }
  }
</style>
<rect class="paper" x="0.5" y="0.5" width="479" height="591" rx="12"/>
<path class="ink" d="M24 580V48A28 28 0 0 1 52 20H376A28 28 0 0 1 404 48V580"/>
<path class="thin" d="M64 64H48M55 57L48 64L55 71"/>
<text class="b" x="80" y="70" text-anchor="start">Lab results</text>
<rect class="thin" x="48" y="96" width="56" height="30" rx="8"/>
<text class="c" x="76" y="115.5" text-anchor="middle">All</text>
<rect class="solid" x="114" y="96" width="186" height="30" rx="8"/>
<text class="c on" x="207" y="115.5" text-anchor="middle">PAPRelay (CPAP machine)</text>
<text class="b" x="48" y="160" text-anchor="start">Past records</text>
<rect class="solid" x="48" y="176" width="104" height="30" rx="8"/>
<text class="c on" x="100" y="195.5" text-anchor="middle">Most recent</text>
<rect class="thin" x="162" y="176" width="104" height="30" rx="8"/>
<text class="c" x="214" y="195.5" text-anchor="middle">Alphabetical</text>
<rect class="faint" x="40" y="222" width="348" height="100" rx="14"/>
<text class="x" x="56" y="246" text-anchor="start">Jan 5 at 12:00 PM</text>
<text class="c" x="56" y="268" text-anchor="start">CPAP therapy usage in the night</text>
<text class="c" x="56" y="286" text-anchor="start">(hours)</text>
<text class="x" x="56" y="308" text-anchor="start">30 results</text>
<text class="b" x="372" y="272" text-anchor="end" style="font-size: 20px">7.5<tspan class="x" dx="5">h</tspan></text>
<rect class="faint" x="40" y="328" width="348" height="118" rx="14"/>
<text class="x" x="56" y="352" text-anchor="start">Jan 5 at 12:00 PM</text>
<text class="c" x="56" y="374" text-anchor="start">Residual apnea-hypopnea index</text>
<text class="c" x="56" y="392" text-anchor="start">on CPAP therapy, as the machine</text>
<text class="c" x="56" y="410" text-anchor="start">reports it (events per hour of use)</text>
<text class="x" x="56" y="432" text-anchor="start">30 results</text>
<text class="b" x="372" y="378" text-anchor="end" style="font-size: 20px">1.5<tspan class="x" dx="5">events/h</tspan></text>
