<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 296" width="480" height="296" role="img" aria-label="How the data flows: from the machine over Bluetooth to the link, the protocol, the decoders and the plans, then to the sync engine, which keeps its state on the phone and writes to Health Connect, to a file and to the screen.">
