<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-label="How data moves through PAPRelay: from the machine over the Bluetooth link, through the protocol client, the decoders and the plans, into the sync engine, which keeps the nights on the phone and passes them to Health Connect, a file, and the screen.">
<title>How data moves through PAPRelay: from the machine over the Bluetooth link, through the protocol client, the decoders and the plans, into the sync engine, which keeps the nights on the phone and passes them to Health Connect, a file, and the screen.</title>
