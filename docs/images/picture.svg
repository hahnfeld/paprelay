<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" role="img" aria-label="How to read the picture in the app: a broken line means not connected, a whole line connected, a moving dashed line data moving, a tick it worked, a red cross it did not work.">
<title>How to read the picture in the app: a broken line means not connected, a whole line connected, a moving dashed line data moving, a tick it worked, a red cross it did not work.</title>
<style>
