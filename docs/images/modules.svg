<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-label="The three modules of PAPRelay: app (Android), as11 (the AirSense 11 protocol) and core (the model and rules). app depends on as11 and core; as11 depends on core.">
<title>The three modules of PAPRelay: app (Android), as11 (the AirSense 11 protocol) and core (the model and rules). app depends on as11 and core; as11 depends on core.</title>
<style>
  .paper { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .ink { fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #1f2328; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke: #6e7781; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .faint { fill: none; stroke: #afb8c1; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 7; }
  .solid { fill: #1f2328; stroke: none; }
  .hole { fill: #ffffff; stroke: none; }
  .bad { fill: #cf222e; stroke: none; }
  .badline { fill: none; stroke: #cf222e; stroke-width: 2.4; stroke-linecap: round; }
  .onbad { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 16px; }
  .b { font-size: 16px; font-weight: 600; }
  .s { font-size: 13px; fill: #57606a; }
  .m { font-size: 11px; }
  .ms { font-size: 10px; fill: #57606a; }
  .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .on { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .paper { fill: #0d1117; stroke: #30363d; }
    .ink, .thin { stroke: #e6edf3; }
    .line { stroke: #8b949e; }
    .faint { stroke: #484f58; }
    .solid { fill: #e6edf3; }
    .hole { fill: #0d1117; }
    .bad { fill: #f85149; }
    .badline { stroke: #f85149; }
    .onbad { stroke: #0d1117; }
    text { fill: #e6edf3; }
    .s, .ms { fill: #8b949e; }
    .num, .on { fill: #0d1117; }
  }
</style>
<rect class="paper" x="0.5" y="0.5" width="719" height="391" rx="12"/>
<rect class="ink" x="40" y="24" width="640" height="124" rx="10"/>
<text class="b" x="54" y="48" text-anchor="start">app  ·  Android</text>
<text class="s" x="54" y="68" text-anchor="start">ui: screens and the picture  ·  sync: engine, stores, background runs</text>
<text class="s" x="54" y="85" text-anchor="start">ble: Bluetooth link and scanning  ·  hc: Health Connect  ·  pairing: the stored key</text>
<text class="s" x="54" y="102" text-anchor="start">check: the device check</text>
<text class="s" x="54" y="119" text-anchor="start">The only module that knows Android.</text>
<rect class="ink" x="40" y="176" width="400" height="106" rx="10"/>
<text class="b" x="54" y="200" text-anchor="start">as11  ·  Kotlin/JVM</text>
<text class="s" x="54" y="220" text-anchor="start">The AirSense 11 protocol: pairing, encrypted session,</text>
<text class="s" x="54" y="237" text-anchor="start">read-only requests, downloads.</text>
<text class="s" x="54" y="254" text-anchor="start">decode: the stored logs  ·  plan: what to pass on</text>
<rect class="ink" x="40" y="310" width="640" height="62" rx="10"/>
<text class="b" x="54" y="334" text-anchor="start">core  ·  Kotlin/JVM</text>
<text class="s" x="54" y="354" text-anchor="start">Units and times  ·  nights and their records  ·  the ledger of what was written</text>
<path class="ink" d="M240 148V170"/>
<path class="ink" d="M233 163L240 172L247 163"/>
<path class="ink" d="M240 282V304"/>
<path class="ink" d="M233 297L240 306L247 297"/>
<path class="ink" d="M560 148V304"/>
<path class="ink" d="M553 297L560 306L567 297"/>
<text class="s" x="574" y="232" text-anchor="start">An arrow points</text>
<text class="s" x="574" y="249" text-anchor="start">at what is used.</text>
</svg>
