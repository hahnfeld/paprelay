<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 288" width="480" height="288" role="img" aria-label="The three modules. app, the Android app, uses as11 and core. as11, the AirSense 11 protocol, uses core. core holds the model and the rules.">
<title>The three modules. app, the Android app, uses as11 and core. as11, the AirSense 11 protocol, uses core. core holds the model and the rules.</title>
<style>
  .paper { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .ink { fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #1f2328; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .line { fill: none; stroke: #6e7781; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .faint { fill: none; stroke: #afb8c1; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 7; }
  .solid { fill: #1f2328; stroke: none; }
  .hole { fill: #ffffff; stroke: none; }
  .bad { fill: #cf222e; stroke: none; }
  .badline { fill: none; stroke: #cf222e; stroke-width: 2.4; stroke-linecap: round; }
  .onbad { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 16px; }
  .b { font-size: 16px; font-weight: 600; }
  .s { font-size: 14px; fill: #57606a; }
  .c { font-size: 13px; }
  .x { font-size: 12px; fill: #57606a; }
  .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .on { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .paper { fill: #0d1117; stroke: #30363d; }
    .ink, .thin { stroke: #e6edf3; }
    .line { stroke: #8b949e; }
    .faint { stroke: #484f58; }
    .solid { fill: #e6edf3; }
    .hole { fill: #0d1117; }
    .bad { fill: #f85149; }
    .badline { stroke: #f85149; }
    .onbad { stroke: #0d1117; }
    text { fill: #e6edf3; }
    .s, .x { fill: #8b949e; }
    .num, .on { fill: #0d1117; }
  }
</style>
<rect class="paper" x="0.5" y="0.5" width="479" height="287" rx="12"/>
<rect class="ink" x="24" y="20" width="432" height="60" rx="10"/>
<text class="b" x="40" y="45" text-anchor="start">app</text>
<text class="s" x="40" y="65" text-anchor="start">The Android app</text>
<rect class="ink" x="24" y="114" width="270" height="60" rx="10"/>
<text class="b" x="40" y="139" text-anchor="start">as11</text>
<text class="s" x="40" y="159" text-anchor="start">The AirSense 11 protocol</text>
<rect class="ink" x="24" y="208" width="432" height="60" rx="10"/>
<text class="b" x="40" y="233" text-anchor="start">core</text>
<text class="s" x="40" y="253" text-anchor="start">Model and rules</text>
