<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 484" width="480" height="484" role="img" aria-label="One figure&#x27;s page in Google Health: the title CPAP therapy usage in the night (hours), Since Jan 1 at 12:00 PM, and one row for each night with its date at 12:00 PM and its value, for example Jan 5 at 12:00 PM, 7.5 h. A night without therapy shows 0 h. Number 4 marks the rows. The dates and values are examples.">
<title>One figure&#x27;s page in Google Health: the title CPAP therapy usage in the night (hours), Since Jan 1 at 12:00 PM, and one row for each night with its date at 12:00 PM and its value, for example Jan 5 at 12:00 PM, 7.5 h. A night without therapy shows 0 h. Number 4 marks the rows. The dates and values are examples.</title>
<style>
