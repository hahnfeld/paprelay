<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-label="PAPRelay copies CPAP data from the machine to the phone over Bluetooth, and from the phone to Health Connect, a file, or another app.">
<title>PAPRelay copies CPAP data from the machine to the phone over Bluetooth, and from the phone to Health Connect, a file, or another app.</title>
<style>
