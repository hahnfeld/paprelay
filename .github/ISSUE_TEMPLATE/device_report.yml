# SPDX-License-Identifier: GPL-3.0-or-later
name: Report a machine or a phone
description: Tell us that PAPRelay works, or does not work, with your machine software or your phone.
body:
  - type: markdown
    attributes:
      value: |
        The stored data was compared with an SD card on one software version. Your report tells us if PAPRelay works on other versions.

        **Do not attach** downloads from the machine, SD-card files or Bluetooth logs. They are your health data. Read "Machines and software versions" in CONTRIBUTING.md.
  - type: input
    id: machine
    attributes:
      label: Machine and its software version
      description: The saved report from Device check names the software version.
      placeholder: "AirSense 11 AutoSet, SW04600.19.8.8.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 10 Pro, Android 17"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PAPRelay version
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything works
        - Pairing works, but PAPRelay says that it cannot read this machine's software
        - The nightly figures work, but respiratory rate does not arrive
        - Pairing does not work
        - Something else
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report from the device check
      description: In PAPRelay, open Device check, run it, choose Save report, and attach or paste the file here.
  - type: textarea
    id: compared
    attributes:
      label: Did you compare the figures with another source?
      description: For example with the machine's SD card in OSCAR. Say which kinds of figures you compared and whether they were equal. Do not post the figures themselves.
  - type: checkboxes
    id: private
    attributes:
      label: Privacy
      options:
        - label: I attached no capture, no SD-card file, no pairing code and no health values.
          required: true
